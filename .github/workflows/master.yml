name: Transaction
on: [workflow_dispatch, push]
jobs:
  stage_dev:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v5
      - name: install deps
        run: npm ci
      - name: lint
        run: npm run lint
      - name: unit-test
        run: npm run test
        env:
          NODE_OPTIONS: --experimental-vm-modules