name: Transaction
on: [workflow_dispatch, push]
jobs:
  stage_dev:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.9'
          cache: 'npm'

      - name: install deps
        run: npm ci
      - name: lint
        run: npm run lint
      - name: unit-test
        run: npm run test